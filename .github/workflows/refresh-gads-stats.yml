name: Refresh Google Ads Stats

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats-push
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Google Ads stats
        env:
          SUPERMETRICS_API_KEY: ${{ secrets.SUPERMETRICS_API_KEY }}
          GADS_ACCOUNT_ID: '3238274495'
        run: node fetch-gads-stats.js

      - name: Commit and push updated stats
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add google_ads_stats.json
          if git diff --staged --quiet; then
            echo "No change in Google Ads data. Nothing to commit."
            exit 0
          fi
          git commit -m "Auto-refresh Google Ads stats $(date -u +%Y-%m-%d)"

          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected. Rebasing onto latest main (attempt $attempt)..."
            git pull --rebase --autostash origin main || {
              echo "Rebase failed; keeping our generated file."
              git checkout --ours google_ads_stats.json || true
              git add google_ads_stats.json || true
              git rebase --continue || git rebase --abort
            }
            sleep 5
          done

          echo "Could not push after 5 attempts."
          exit 1
